[project]
name = "deckslots"
version = "0.3.0"
description = "EDH deckbuilding through a slots system"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]

[project.scripts]
deckslots = "deckslots.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deckslots"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-qt>=4.4.0",
    "ruff>=0.15.1",
    "ty>=0.0.20",
]
