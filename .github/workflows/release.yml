name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - run: uv sync --extra gui
      - run: uv pip install pyinstaller
      - run: uv run pyinstaller packaging/deckslots.spec --distpath dist/
      - name: Smoke-test binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/deckslots --help
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
          if [ ! -f packaging/deckslots.png ]; then
            # Fallback 256x256 placeholder so the AppImage builds in CI even
            # before an artist drops in the real icon. Replace before release.
            python -c "from PIL import Image; Image.new('RGBA',(256,256),(82,72,200,255)).save('packaging/deckslots.png')" \
              || (sudo apt-get install -y python3-pil && \
                  python3 -c "from PIL import Image; Image.new('RGBA',(256,256),(82,72,200,255)).save('packaging/deckslots.png')")
          fi
          bash packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra gui
      - run: uv pip install pyinstaller
      - run: uv run pyinstaller packaging/deckslots.spec --distpath dist/
      - name: Smoke-test binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\dist\deckslots.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/deckslots.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra gui
      - run: uv pip install pyinstaller
      - run: uv run pyinstaller packaging/deckslots.spec --distpath dist/
      - name: Smoke-test binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/deckslots --help
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/deckslots

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/*.AppImage
            windows/deckslots.exe
            macos/deckslots
